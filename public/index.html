<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe Trade - x402 Payments</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Courier New', monospace;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1e3f 100%);
      color: #00ff88;
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 30px;
      text-shadow: 0 0 10px #00ff88;
    }
    
    .card {
      background: rgba(26, 30, 63, 0.8);
      border: 2px solid #00ff88;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    
    input, select {
      width: 100%;
      padding: 10px;
      background: #0a0e27;
      border: 1px solid #00ff88;
      color: #00ff88;
      font-family: monospace;
      border-radius: 4px;
    }
    
    input:focus, select:focus {
      outline: none;
      box-shadow: 0 0 10px #00ff88;
    }
    
    button {
      width: 100%;
      padding: 12px;
      background: #00ff88;
      color: #0a0e27;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    button:hover {
      background: #00dd77;
      box-shadow: 0 0 20px #00ff88;
    }
    
    button:disabled {
      background: #666;
      cursor: not-allowed;
      box-shadow: none;
    }
    
    #result {
      background: #0a0e27;
      border: 1px solid #00ff88;
      border-radius: 4px;
      padding: 15px;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 12px;
    }
    
    .status {
      text-align: center;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
    }
    
    .status.loading {
      background: #1a3a1a;
      color: #00ff88;
    }
    
    .status.success {
      background: #1a3a1a;
      color: #00ff88;
    }
    
    .status.error {
      background: #3a1a1a;
      color: #ff0000;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Vibe Trade Agent</h1>
    
    <div class="card">
      <h2>Analyze Trading Opportunities</h2>
      <p style="margin-bottom: 20px; opacity: 0.8;">
        Uses x402 USDC micropayments on Base network
      </p>
      
      <div class="form-group">
        <label for="symbol">Trading Symbol:</label>
        <input 
          type="text" 
          id="symbol" 
          value="BTC" 
          placeholder="e.g., BTC, ETH, SOL"
        />
      </div>
      
      <div class="form-group">
        <label for="timeframe">Timeframe:</label>
        <select id="timeframe">
          <option value="1m">1 minute</option>
          <option value="5m">5 minutes</option>
          <option value="15m">15 minutes</option>
          <option value="1h" selected>1 hour</option>
          <option value="4h">4 hours</option>
          <option value="1d">1 day</option>
          <option value="1w">1 week</option>
        </select>
      </div>
      
      <button id="invokeBtn" onclick="invokeAgent()">
        💰 Invoke (x402 Payment Required)
      </button>
      
      <div id="status"></div>
    </div>
    
    <div class="card">
      <h2>Response:</h2>
      <div id="result">Ready to invoke...</div>
    </div>
  </div>
  
  <!-- Load x402-fetch for automatic payment handling -->
  <script src="https://cdn.jsdelivr.net/npm/x402-fetch@latest"></script>
  
  <script>
    const AGENT_URL = window.location.origin + '/';
    
    async function invokeAgent() {
      const symbol = document.getElementById('symbol').value.toUpperCase();
      const timeframe = document.getElementById('timeframe').value;
      const resultDiv = document.getElementById('result');
      const statusDiv = document.getElementById('status');
      const btn = document.getElementById('invokeBtn');
      
      if (!symbol) {
        statusDiv.innerHTML = '<div class="status error">❌ Please enter a symbol</div>';
        return;
      }
      
      // Disable button and show loading
      btn.disabled = true;
      statusDiv.innerHTML = '<div class="status loading">⏳ Connecting wallet and processing payment...</div>';
      resultDiv.textContent = 'Loading...';
      
      try {
        console.log('Invoking agent with:', { symbol, timeframe });
        
        // Use x402-fetch which automatically handles:
        // 1. Detects 402 Payment Required response
        // 2. Prompts user to connect wallet
        // 3. Generates x402 payment
        // 4. Sends payment with request
        // 5. Returns response
        
        const response = await x402Fetch(AGENT_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            entrypoint: 'analyze',
            input: {
              symbol: symbol,
              timeframe: timeframe
            }
          })
        });
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const data = await response.json();
        
        statusDiv.innerHTML = '<div class="status success">✅ Payment successful!</div>';
        resultDiv.textContent = JSON.stringify(data, null, 2);
        
      } catch (error) {
        console.error('Error:', error);
        statusDiv.innerHTML = `<div class="status error">❌ Error: ${error.message}</div>`;
        resultDiv.textContent = `Error: ${error.message}\n\nMake sure:\n1. MetaMask is installed\n2. You're connected to Base network\n3. You have USDC balance`;
      } finally {
        btn.disabled = false;
      }
    }
    
    // Check if x402-fetch loaded
    window.addEventListener('load', () => {
      if (!window.x402Fetch) {
        document.getElementById('status').innerHTML = 
          '<div class="status error">⚠️ x402-fetch library failed to load. Check your internet connection.</div>';
      } else {
        console.log('✅ x402-fetch loaded successfully');
      }
    });
  </script>
</body>
</html>
